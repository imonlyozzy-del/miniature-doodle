<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sesli Yapılacaklar Listesi</title>
  <style>
    :root {
      --bg-color: #ffffff;
      --text-color: #222222;
      --card-bg: #ffffff;
      --border-color: #eeeeee;
      --header-bg: #ffffff;
      --status-color: #666666;
      --drag-handle: #aaaaaa;
      --xp-bg: #eef9f1;
      --xp-border: #c8e6c9;
      --xp-text: #2e7d32;
      --minus-bg: #e0e0e0;
      --minus-text: #333333;
      --fab-bg: #007bff;
      --fab-active: #0056b3;
      --reset-fab-bg: #f57c00;
      --reset-fab-active: #e65100;
      --status-bg: rgba(255, 255, 255, 0.95);
      --status-shadow: rgba(0,0,0,0.12);
    }

    body.dark-mode {
      --bg-color: #121212;
      --text-color: #e0e0e0;
      --card-bg: #1e1e1e;
      --border-color: #2c2c2c;
      --header-bg: #1e1e1e;
      --status-color: #aaa;
      --drag-handle: #777777;
      --xp-bg: #1b3320;
      --xp-border: #2e7d32;
      --xp-text: #81c784;
      --minus-bg: #333333;
      --minus-text: #ffffff;
      --fab-bg: #0d6efd;
      --fab-active: #0b5ed7;
      --reset-fab-bg: #fb8c00;
      --reset-fab-active: #f57c00;
      --status-bg: rgba(30, 30, 30, 0.95);
      --status-shadow: rgba(0,0,0,0.5);
    }

    body { 
      font-family: system-ui, -apple-system, sans-serif; 
      padding: 20px; 
      max-width: 500px; 
      margin: auto; 
      padding-bottom: 140px;
      background-color: var(--bg-color);
      color: var(--text-color);
      transition: background-color 0.3s, color 0.3s;
    }
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
      margin-bottom: 15px;
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    h2 { 
      margin: 0; 
      cursor: pointer; 
      user-select: none;
    }
    h2:active {
      opacity: 0.7;
    }
    
    /* XP Sayacı Stilleri */
    .xp-container {
      display: flex;
      align-items: center;
      background: var(--xp-bg);
      border: 1px solid var(--xp-border);
      padding: 6px 12px;
      border-radius: 20px;
      font-weight: bold;
      color: var(--xp-text);
      font-size: 15px;
    }
    .minus-btn {
      background: var(--minus-bg);
      color: var(--minus-text);
      border: none;
      border-radius: 50%;
      width: 24px;
      height: 24px;
      margin-left: 8px;
      cursor: pointer;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }

    ul { list-style-type: none; padding: 0; }
    li { 
      padding: 14px 10px; 
      border-bottom: 1px solid var(--border-color); 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      font-size: 16px;
      background: var(--card-bg);
      user-select: none;
      touch-action: manipulation;
    }
    li.dragging {
      opacity: 0.5;
    }
    .drag-handle {
      cursor: grab;
      margin-right: 10px;
      color: var(--drag-handle);
      font-size: 18px;
    }
    
    .recurring-toggle {
      cursor: pointer;
      font-size: 16px;
      margin-right: 10px;
      opacity: 0.35;
      filter: grayscale(100%);
      transition: opacity 0.2s, filter 0.2s, transform 0.2s;
      user-select: none;
    }
    .recurring-toggle.active {
      opacity: 1;
      filter: grayscale(0%);
      transform: scale(1.15);
    }

    .item-content {
      display: flex;
      align-items: center;
      flex-grow: 1;
    }
    .actions {
      display: flex;
      gap: 6px;
    }
    .complete-btn {
      background: #28a745;
      color: white;
      border: none;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }
    .delete-btn { 
      background: #ff4d4d; 
      color: white; 
      border: none; 
      padding: 6px 10px; 
      border-radius: 6px; 
      cursor: pointer; 
      font-size: 14px;
    }
    
    /* Yüzen Buton Grubu (FAB Stack) */
    .fab-container {
      position: fixed;
      bottom: 24px;
      right: 24px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 12px;
      z-index: 1000;
    }
    
    .fab-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    #status { 
      color: var(--status-color); 
      font-size: 13px; 
      margin: 0;
      background: var(--status-bg);
      padding: 8px 14px;
      border-radius: 20px;
      box-shadow: 0 4px 12px var(--status-shadow);
      border: 1px solid var(--border-color);
      white-space: nowrap;
      opacity: 0;
      transform: translateY(4px);
      transition: opacity 0.2s, transform 0.2s;
      pointer-events: none;
    }
    #status.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* Genel FAB Buton Stili */
    .fab-btn { 
      width: 52px;
      height: 52px;
      color: white;
      border: none;
      border-radius: 18px;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(0,0,0,0.22);
      transition: transform 0.2s, background-color 0.2s, box-shadow 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
    }
    .fab-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.28);
    }
    .fab-btn:active {
      transform: scale(0.92);
    }

    /* Mikrofon Butonu */
    #recordBtn {
      background-color: var(--fab-bg);
    }
    #recordBtn:active {
      background-color: var(--fab-active);
    }

    /* Sıfırlama Butonu */
    #resetFabBtn {
      background-color: var(--reset-fab-bg);
      font-size: 20px;
      line-height: 1;
    }
    #resetFabBtn:active {
      background-color: var(--reset-fab-active);
    }

    .fab-btn svg {
      display: block;
    }
  </style>
</head>
<body>

  <div class="header-bar">
    <h2 id="appTitle" title="Temayı değiştirmek için tıklayın">Yapılacaklar Listesi</h2>
    <div class="header-right">
      <div class="xp-container">
        <span id="xpDisplay">XP: 0</span>
        <button class="minus-btn" id="minusXpBtn" title="1 XP Düşür">-1</button>
      </div>
    </div>
  </div>
  
  <ul id="todoList"></ul>

  <!-- Yüzen Buton Grubu (Üst Üste Düzen) -->
  <div class="fab-container">
    <!-- Sıfırlama Butonu (Üstte) -->
    <div class="fab-row">
      <button class="fab-btn" id="resetFabBtn" title="Tekrarlayan Görevleri Sıfırla">⟳</button>
    </div>

    <!-- Sesle Ekleme Butonu (Altta) -->
    <div class="fab-row">
      <p id="status"></p>
      <button class="fab-btn" id="recordBtn" title="Sesle Görev Ekle">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
          <line x1="12" y1="19" x2="12" y2="22"/>
        </svg>
      </button>
    </div>
  </div>

  <script>
    const recordBtn = document.getElementById('recordBtn');
    const resetFabBtn = document.getElementById('resetFabBtn');
    const status = document.getElementById('status');
    const todoList = document.getElementById('todoList');
    const xpDisplay = document.getElementById('xpDisplay');
    const minusXpBtn = document.getElementById('minusXpBtn');
    const appTitle = document.getElementById('appTitle');

    let rawTodos = JSON.parse(localStorage.getItem('myTodos')) || [];
    let todos = rawTodos.map((item, index) => {
      if (typeof item === 'string') {
        return {
          id: Date.now() + '_' + Math.random().toString(36).substr(2, 9),
          text: item,
          isRecurring: false,
          isCompleted: false,
          order: index
        };
      }
      return item;
    });

    let xp = parseInt(localStorage.getItem('userXP')) || 0;
    let isDarkMode = localStorage.getItem('darkMode') === 'true';

    function saveTodos() {
      localStorage.setItem('myTodos', JSON.stringify(todos));
    }

    function applyTheme() {
      if (isDarkMode) {
        document.body.classList.add('dark-mode');
      } else {
        document.body.classList.remove('dark-mode');
      }
    }

    appTitle.addEventListener('click', () => {
      isDarkMode = !isDarkMode;
      localStorage.setItem('darkMode', isDarkMode);
      applyTheme();
    });

    function updateXP(newXp) {
      xp = Math.max(0, newXp);
      localStorage.setItem('userXP', xp);
      xpDisplay.textContent = `XP: ${xp}`;
    }

    minusXpBtn.addEventListener('click', () => {
      updateXP(xp - 1);
    });

    // Tekrarlayan Görevleri Sıfırla (Yüzen Buton)
    resetFabBtn.addEventListener('click', () => {
      todos.forEach(todo => {
        if (todo.isRecurring && todo.isCompleted) {
          todo.isCompleted = false;
        }
      });
      saveTodos();
      renderTodos();
      setStatusText('Tekrarlayanlar sıfırlandı!');
      setTimeout(() => setStatusText(''), 2000);
    });

    function capitalizeFirstLetter(string) {
      if (!string) return '';
      return string.charAt(0).toLocaleUpperCase('tr-TR') + string.slice(1);
    }

    function setStatusText(text) {
      if (!text) {
        status.classList.remove('visible');
        setTimeout(() => { status.textContent = ''; }, 200);
      } else {
        status.textContent = text;
        status.classList.add('visible');
      }
    }

    function renderTodos() {
      todoList.innerHTML = '';
      
      let visibleTodos = todos.filter(todo => !todo.isCompleted);

      visibleTodos.sort((a, b) => {
        if (a.isRecurring === b.isRecurring) {
          return a.order - b.order;
        }
        return a.isRecurring ? 1 : -1;
      });

      visibleTodos.forEach((todo) => {
        const li = document.createElement('li');
        li.draggable = true;
        li.dataset.id = todo.id;

        const contentDiv = document.createElement('div');
        contentDiv.className = 'item-content';

        const dragHandle = document.createElement('span');
        dragHandle.className = 'drag-handle';
        dragHandle.innerHTML = '☰';

        const recurringToggle = document.createElement('span');
        recurringToggle.className = `recurring-toggle ${todo.isRecurring ? 'active' : ''}`;
        recurringToggle.innerHTML = '🔄';
        recurringToggle.title = todo.isRecurring ? 'Tekrarlayan Görev (Aktif)' : 'Tek Seferlik Görev (Pasif)';
        recurringToggle.onclick = (e) => {
          e.stopPropagation();
          toggleRecurring(todo.id);
        };

        const span = document.createElement('span');
        span.textContent = todo.text;

        contentDiv.appendChild(dragHandle);
        contentDiv.appendChild(recurringToggle);
        contentDiv.appendChild(span);

        const actionsDiv = document.createElement('div');
        actionsDiv.className = 'actions';

        const completeBtn = document.createElement('button');
        completeBtn.textContent = '✓';
        completeBtn.className = 'complete-btn';
        completeBtn.title = 'Tamamla (+1 XP)';
        completeBtn.onclick = () => completeTodo(todo.id);

        const delBtn = document.createElement('button');
        delBtn.textContent = 'Sil';
        delBtn.className = 'delete-btn';
        delBtn.onclick = () => removeTodo(todo.id);

        actionsDiv.appendChild(completeBtn);
        actionsDiv.appendChild(delBtn);

        li.appendChild(contentDiv);
        li.appendChild(actionsDiv);

        addDragListeners(li);
        todoList.appendChild(li);
      });
    }

    function toggleRecurring(id) {
      const todo = todos.find(t => t.id === id);
      if (todo) {
        todo.isRecurring = !todo.isRecurring;
        if (todo.isRecurring) {
          const maxOrder = todos.reduce((max, t) => Math.max(max, t.order || 0), 0);
          todo.order = maxOrder + 1;
        }
        saveTodos();
        renderTodos();
      }
    }

    let draggedItem = null;

    function addDragListeners(item) {
      item.addEventListener('dragstart', (e) => {
        draggedItem = item;
        item.classList.add('dragging');
      });

      item.addEventListener('dragend', () => {
        draggedItem = null;
        item.classList.remove('dragging');
        saveNewOrder();
      });

      item.addEventListener('dragover', (e) => {
        e.preventDefault();
        const afterElement = getDragAfterElement(todoList, e.clientY);
        if (afterElement == null) {
          todoList.appendChild(draggedItem);
        } else {
          todoList.insertBefore(draggedItem, afterElement);
        }
      });
    }

    function getDragAfterElement(container, y) {
      const draggableElements = [...container.querySelectorAll('li:not(.dragging)')];

      return draggableElements.reduce((closest, child) => {
        const box = child.getBoundingClientRect();
        const offset = y - box.top - box.height / 2;
        if (offset < 0 && offset > closest.offset) {
          return { offset: offset, element: child };
        } else {
          return closest;
        }
      }, { offset: Number.NEGATIVE_INFINITY }).element;
    }

    function saveNewOrder() {
      const listItems = todoList.querySelectorAll('li');
      listItems.forEach((li, newIndex) => {
        const id = li.dataset.id;
        const todo = todos.find(t => t.id === id);
        if (todo) {
          todo.order = newIndex;
        }
      });
      saveTodos();
    }

    function addTodo(text) {
      const formattedText = capitalizeFirstLetter(text);
      const newTodo = {
        id: Date.now() + '_' + Math.random().toString(36).substr(2, 9),
        text: formattedText,
        isRecurring: false,
        isCompleted: false,
        order: todos.length
      };
      todos.push(newTodo);
      saveTodos();
      renderTodos();
    }

    function completeTodo(id) {
      const index = todos.findIndex(t => t.id === id);
      if (index !== -1) {
        const todo = todos[index];
        if (todo.isRecurring) {
          todo.isCompleted = true;
        } else {
          todos.splice(index, 1);
        }
        saveTodos();
        updateXP(xp + 1);
        renderTodos();
      }
    }

    function removeTodo(id) {
      const index = todos.findIndex(t => t.id === id);
      if (index !== -1) {
        todos.splice(index, 1);
        saveTodos();
        renderTodos();
      }
    }

    applyTheme();
    updateXP(xp);
    renderTodos();

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (SpeechRecognition) {
      const recognition = new SpeechRecognition();
      recognition.lang = 'tr-TR';

      recordBtn.addEventListener('click', () => {
        recognition.start();
        setStatusText('Dinleniyor... Konuşun');
      });

      recognition.onresult = (event) => {
        let text = event.results[0][0].transcript;
        text = capitalizeFirstLetter(text);
        setStatusText(`Eklenen: "${text}"`);
        addTodo(text);
        setTimeout(() => setStatusText(''), 2500);
      };

      recognition.onerror = () => { 
        setStatusText('Ses anlaşılamadı!'); 
        setTimeout(() => setStatusText(''), 2500);
      };

      recognition.onend = () => { 
        if (status.textContent === 'Dinleniyor... Konuşun') {
          setStatusText('');
        }
      };
    } else {
      setStatusText('Tarayıcı ses desteklemiyor.');
    }
  </script>
</body>
</html>
