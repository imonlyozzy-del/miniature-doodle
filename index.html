<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPG Görev Yöneticisi</title>
    <!-- Sortable.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
    <style>
        :root {
            --bg-color: #121212;
            --surface-color: #1e1e1e;
            --surface-hover: #2a2a2a;
            --primary-color: #bb86fc;
            --primary-variant: #3700b3;
            --secondary-color: #03dac6;
            --text-color: #e0e0e0;
            --text-muted: #a0a0a0;
            --border-color: #333333;
            --danger-color: #cf6679;
            --gold-color: #ffd700;
        }

        body.light-theme {
            --bg-color: #f4f5f7;
            --surface-color: #ffffff;
            --surface-hover: #f0f0f0;
            --primary-color: #6200ee;
            --primary-variant: #3700b3;
            --secondary-color: #018786;
            --text-color: #212121;
            --text-muted: #666666;
            --border-color: #e0e0e0;
            --danger-color: #b00020;
            --gold-color: #b8860b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: background-color 0.3s, color 0.3s;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .theme-toggle {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-color);
        }

        /* Hero / RPG Stats Section */
        .stats-card {
            background-color: var(--surface-color);
            border-radius: 8px;
            padding: 15px 20px;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .stats-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .level-badge {
            background-color: var(--primary-color);
            color: #000;
            font-weight: bold;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.9rem;
        }

        .bar-container {
            background-color: var(--border-color);
            border-radius: 10px;
            height: 12px;
            width: 100%;
            overflow: hidden;
            margin-top: 5px;
        }

        .xp-bar {
            background: linear-gradient(90deg, var(--primary-color), var(--secondary-color));
            height: 100%;
            width: 0%;
            transition: width 0.4s ease-in-out;
        }

        .stat-details {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 5px;
        }

        /* Input Controls */
        .controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
            background-color: var(--surface-color);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            margin-bottom: 20px;
        }

        .input-group {
            display: flex;
            gap: 10px;
        }

        input[type="text"], select, input[type="date"] {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 10px;
            border-radius: 5px;
            outline: none;
        }

        input[type="text"] {
            flex-grow: 1;
        }

        button.btn {
            background-color: var(--primary-color);
            color: #000;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        button.btn:hover {
            opacity: 0.9;
        }

        button.voice-btn {
            background-color: var(--surface-hover);
            color: var(--text-color);
            border: 1px solid var(--border-color);
        }

        button.voice-btn.listening {
            background-color: var(--danger-color);
            color: white;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        .options-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        /* Filter Section */
        .filters {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            overflow-x: auto;
            padding-bottom: 5px;
        }

        .filter-btn {
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 6px 12px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 0.85rem;
            white-space: nowrap;
        }

        .filter-btn.active {
            background-color: var(--primary-color);
            color: #000;
            border-color: var(--primary-color);
            font-weight: bold;
        }

        /* Task List */
        .task-list {
            list-style-type: none;
            min-height: 50px;
        }

        .task-item {
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            cursor: grab;
        }

        .task-item:active {
            cursor: grabbing;
        }

        .task-main {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .task-left {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-grow: 1;
        }

        .task-title {
            font-size: 1rem;
            word-break: break-word;
        }

        .task-title.completed {
            text-decoration: line-through;
            color: var(--text-muted);
        }

        .task-tags {
            display: flex;
            gap: 5px;
            font-size: 0.75rem;
            align-items: center;
        }

        .tag {
            padding: 2px 6px;
            border-radius: 4px;
            background-color: var(--border-color);
            color: var(--text-color);
        }

        .tag.difficulty-kolay { color: #8bc34a; }
        .tag.difficulty-orta { color: #ffb74d; }
        .tag.difficulty-zor { color: #e57373; }

        .tag.repeat {
            background-color: var(--primary-variant);
            color: white;
        }

        .task-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .action-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 1rem;
        }

        .action-btn:hover {
            color: var(--text-color);
        }

        .delete-btn:hover {
            color: var(--danger-color);
        }

        /* Subtasks Section */
        .subtasks-container {
            margin-left: 25px;
            margin-top: 5px;
            border-left: 2px solid var(--border-color);
            padding-left: 10px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .subtask-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.9rem;
            padding: 4px 0;
        }

        .subtask-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .add-subtask-form {
            display: flex;
            gap: 5px;
            margin-top: 5px;
            margin-left: 25px;
        }

        .add-subtask-form input {
            padding: 4px 8px;
            font-size: 0.85rem;
        }

        .add-subtask-form button {
            padding: 4px 8px;
            font-size: 0.85rem;
        }

        .toggle-subtasks-btn {
            font-size: 0.8rem;
            color: var(--text-muted);
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* Drag & Drop Ghost Elements */
        .sortable-ghost {
            opacity: 0.4;
            background-color: var(--surface-hover);
        }

        /* Checkbox styling */
        input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--primary-color);
            cursor: pointer;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>⚔️ RPG Görev Yöneticisi</h1>
        <button class="theme-toggle" id="themeToggleBtn">🌙</button>
    </header>

    <!-- Character Stats (XP & Level) -->
    <section class="stats-card">
        <div class="stats-header">
            <div>
                <span style="font-size: 1.2rem; font-weight: bold;">Kahraman</span>
                <span class="level-badge" id="levelBadge">Seviye 1</span>
            </div>
            <div style="color: var(--gold-color); font-weight: bold;" id="goldCounter">💰 0 Altın</div>
        </div>
        <div class="bar-container">
            <div class="xp-bar" id="xpBar"></div>
        </div>
        <div class="stat-details">
            <span id="xpText">XP: 0 / 100</span>
            <span id="completedCount">Tamamlanan: 0</span>
        </div>
    </section>

    <!-- Task Input Form -->
    <section class="controls">
        <div class="input-group">
            <input type="text" id="taskInput" placeholder="Yeni bir görev ekleyin veya sesli komut verin...">
            <button class="btn voice-btn" id="voiceBtn" title="Sesli Komut Ver">🎤</button>
            <button class="btn" id="addTaskBtn">Ekle</button>
        </div>
        <div class="options-group">
            <select id="difficultySelect">
                <option value="kolay">Kolay (+10 XP)</option>
                <option value="orta" selected>Orta (+20 XP)</option>
                <option value="zor">Zor (+40 XP)</option>
            </select>
            <select id="repeatSelect">
                <option value="none">Tekrarlanmaz</option>
                <option value="daily">Her Gün</option>
                <option value="weekly">Her Haftalık</option>
            </select>
            <input type="date" id="dueDateInput">
        </div>
    </section>

    <!-- Filters -->
    <section class="filters">
        <button class="filter-btn active" data-filter="all">Tümü</button>
        <button class="filter-btn" data-filter="active">Aktif</button>
        <button class="filter-btn" data-filter="completed">Tamamlanan</button>
        <button class="filter-btn" data-filter="repeat">Tekrarlayanlar</button>
    </section>

    <!-- Main Task List -->
    <ul class="task-list" id="taskList"></ul>
</div>

<script>
    // State Management
    let state = {
        tasks: JSON.parse(localStorage.getItem('rpg_tasks')) || [],
        user: JSON.parse(localStorage.getItem('rpg_user')) || { level: 1, xp: 0, maxXp: 100, gold: 0, completedTotal: 0 },
        theme: localStorage.getItem('rpg_theme') || 'dark',
        currentFilter: 'all'
    };

    // DOM Elements
    const taskInput = document.getElementById('taskInput');
    const addTaskBtn = document.getElementById('addTaskBtn');
    const voiceBtn = document.getElementById('voiceBtn');
    const difficultySelect = document.getElementById('difficultySelect');
    const repeatSelect = document.getElementById('repeatSelect');
    const dueDateInput = document.getElementById('dueDateInput');
    const taskList = document.getElementById('taskList');
    const themeToggleBtn = document.getElementById('themeToggleBtn');
    const levelBadge = document.getElementById('levelBadge');
    const xpBar = document.getElementById('xpBar');
    const xpText = document.getElementById('xpText');
    const goldCounter = document.getElementById('goldCounter');
    const completedCount = document.getElementById('completedCount');
    const filterBtns = document.querySelectorAll('.filter-btn');

    // Initialize Application
    function init() {
        if (state.theme === 'light') {
            document.body.classList.add('light-theme');
            themeToggleBtn.textContent = '☀️';
        }
        
        renderUserStats();
        renderTasks();
        setupDragAndDrop();

        // Event Listeners
        addTaskBtn.addEventListener('click', handleAddTask);
        taskInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') handleAddTask(); });
        themeToggleBtn.addEventListener('click', toggleTheme);
        voiceBtn.addEventListener('click', startVoiceRecognition);

        filterBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                filterBtns.forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                state.currentFilter = e.target.dataset.filter;
                renderTasks();
            });
        });
    }

    // Save State
    function saveState() {
        localStorage.setItem('rpg_tasks', JSON.stringify(state.tasks));
        localStorage.setItem('rpg_user', JSON.stringify(state.user));
    }

    // Theme Toggle
    function toggleTheme() {
        document.body.classList.toggle('light-theme');
        state.theme = document.body.classList.contains('light-theme') ? 'light' : 'dark';
        themeToggleBtn.textContent = state.theme === 'light' ? '☀️' : '🌙';
        localStorage.setItem('rpg_theme', state.theme);
    }

    // Add Task
    function handleAddTask() {
        const title = taskInput.value.trim();
        if (!title) return;

        const newTask = {
            id: Date.now().toString(),
            title: title,
            difficulty: difficultySelect.value,
            repeat: repeatSelect.value,
            dueDate: dueDateInput.value || null,
            completed: false,
            subtasks: [],
            collapsed: false
        };

        state.tasks.push(newTask);
        saveState();
        renderTasks();

        // Reset Form
        taskInput.value = '';
        dueDateInput.value = '';
        repeatSelect.value = 'none';
        difficultySelect.value = 'orta';
    }

    // XP & Level System
    function addXp(amount) {
        state.user.xp += amount;
        state.user.gold += Math.floor(amount / 2);

        if (state.user.xp >= state.user.maxXp) {
            state.user.xp -= state.user.maxXp;
            state.user.level += 1;
            state.user.maxXp = Math.floor(state.user.maxXp * 1.5);
            alert(`🎉 TEBRİKLER! Seviye ${state.user.level} oldunuz!`);
        }

        saveState();
        renderUserStats();
    }

    function renderUserStats() {
        levelBadge.textContent = `Seviye ${state.user.level}`;
        goldCounter.textContent = `💰 ${state.user.gold} Altın`;
        xpText.textContent = `XP: ${state.user.xp} / ${state.user.maxXp}`;
        completedCount.textContent = `Tamamlanan: ${state.user.completedTotal}`;
        
        const xpPercent = Math.min(100, Math.floor((state.user.xp / state.user.maxXp) * 100));
        xpBar.style.width = `${xpPercent}%`;
    }

    // Render Tasks
    function renderTasks() {
        taskList.innerHTML = '';

        const filteredTasks = state.tasks.filter(task => {
            if (state.currentFilter === 'active') return !task.completed;
            if (state.currentFilter === 'completed') return task.completed;
            if (state.currentFilter === 'repeat') return task.repeat !== 'none';
            return true;
        });

        filteredTasks.forEach(task => {
            const li = document.createElement('li');
            li.className = 'task-item';
            li.dataset.id = task.id;

            const xpRewards = { kolay: 10, orta: 20, zor: 40 };

            li.innerHTML = `
                <div class="task-main">
                    <div class="task-left">
                        <input type="checkbox" ${task.completed ? 'checked' : ''} onchange="toggleTask('${task.id}')">
                        <span class="task-title ${task.completed ? 'completed' : ''}">${escapeHtml(task.title)}</span>
                    </div>
                    <div class="task-actions">
                        <div class="task-tags">
                            <span class="tag difficulty-${task.difficulty}">${task.difficulty.toUpperCase()}</span>
                            ${task.repeat !== 'none' ? `<span class="tag repeat">🔄 ${task.repeat}</span>` : ''}
                            ${task.dueDate ? `<span class="tag">📅 ${task.dueDate}</span>` : ''}
                        </div>
                        ${task.subtasks.length > 0 ? `
                            <button class="toggle-subtasks-btn" onclick="toggleCollapse('${task.id}')">
                                ${task.collapsed ? '▶' : '▼'} (${task.subtasks.filter(s => s.completed).length}/${task.subtasks.length})
                            </button>
                        ` : ''}
                        <button class="action-btn delete-btn" onclick="deleteTask('${task.id}')">🗑️</button>
                    </div>
                </div>

                <!-- Alt Görevler Alanı -->
                <div class="subtasks-container ${task.collapsed ? 'hidden' : ''}" id="subtasks-${task.id}">
                    ${task.subtasks.map(sub => `
                        <div class="subtask-item">
                            <div class="subtask-left">
                                <input type="checkbox" ${sub.completed ? 'checked' : ''} onchange="toggleSubtask('${task.id}', '${sub.id}')">
                                <span class="${sub.completed ? 'completed' : ''}">${escapeHtml(sub.title)}</span>
                            </div>
                            <button class="action-btn delete-btn" onclick="deleteSubtask('${task.id}', '${sub.id}')">✕</button>
                        </div>
                    `).join('')}
                    <div class="add-subtask-form">
                        <input type="text" placeholder="Alt görev ekle..." id="subInput-${task.id}">
                        <button class="btn" onclick="addSubtask('${task.id}')">+</button>
                    </div>
                </div>
            `;

            taskList.appendChild(li);
        });
    }

    // Task Operations
    window.toggleTask = function(id) {
        const task = state.tasks.find(t => t.id === id);
        if (!task) return;

        task.completed = !task.completed;

        if (task.completed) {
            const xpRewards = { kolay: 10, orta: 20, zor: 40 };
            addXp(xpRewards[task.difficulty] || 10);
            state.user.completedTotal += 1;

            // Tekrarlayan görev mekanizması
            if (task.repeat !== 'none') {
                setTimeout(() => {
                    task.completed = false;
                    saveState();
                    renderTasks();
                }, 2000);
            }
        }

        saveState();
        renderTasks();
    };

    window.deleteTask = function(id) {
        state.tasks = state.tasks.filter(t => t.id !== id);
        saveState();
        renderTasks();
    };

    window.toggleCollapse = function(id) {
        const task = state.tasks.find(t => t.id === id);
        if (task) {
            task.collapsed = !task.collapsed;
            saveState();
            renderTasks();
        }
    };

    // Subtask Operations
    window.addSubtask = function(taskId) {
        const input = document.getElementById(`subInput-${taskId}`);
        const title = input.value.trim();
        if (!title) return;

        const task = state.tasks.find(t => t.id === taskId);
        if (task) {
            task.subtasks.push({
                id: Date.now().toString(),
                title: title,
                completed: false
            });
            saveState();
            renderTasks();
        }
    };

    window.toggleSubtask = function(taskId, subId) {
        const task = state.tasks.find(t => t.id === taskId);
        if (task) {
            const sub = task.subtasks.find(s => s.id === subId);
            if (sub) {
                sub.completed = !sub.completed;
                if (sub.completed) addXp(5); // Alt görev tamamlandığında +5 XP
                saveState();
                renderTasks();
            }
        }
    };

    window.deleteSubtask = function(taskId, subId) {
        const task = state.tasks.find(t => t.id === taskId);
        if (task) {
            task.subtasks = task.subtasks.filter(s => s.id !== subId);
            saveState();
            renderTasks();
        }
    };

    // Drag & Drop
    function setupDragAndDrop() {
        new Sortable(taskList, {
            animation: 150,
            ghostClass: 'sortable-ghost',
            onEnd: function () {
                const updatedTasks = [];
                const items = taskList.querySelectorAll('.task-item');
                items.forEach(item => {
                    const id = item.dataset.id;
                    const task = state.tasks.find(t => t.id === id);
                    if (task) updatedTasks.push(task);
                });
                state.tasks = updatedTasks;
                saveState();
            }
        });
    }

    // Voice Recognition
    function startVoiceRecognition() {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
            alert('Üzgünüm, tarayıcınız sesli komut özelliğini desteklemiyor.');
            return;
        }

        const recognition = new SpeechRecognition();
        recognition.lang = 'tr-TR';

        recognition.onstart = function() {
            voiceBtn.classList.add('listening');
        };

        recognition.onend = function() {
            voiceBtn.classList.remove('listening');
        };

        recognition.onresult = function(event) {
            const transcript = event.results[0][0].transcript;
            taskInput.value = transcript;
            handleAddTask();
        };

        recognition.start();
    }

    // Utility
    function escapeHtml(str) {
        return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    // Start App
    init();
</script>
</body>
</html>
