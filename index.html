<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sesli Yapılacaklar Listesi</title>
  <style>
    :root {
      --bg-color: #ffffff;
      --text-color: #222222;
      --card-bg: #ffffff;
      --border-color: #eeeeee;
      --header-bg: #ffffff;
      --status-color: #666666;
      --drag-handle: #aaaaaa;
      --xp-bg: #eef9f1;
      --xp-border: #c8e6c9;
      --xp-text: #2e7d32;
      --minus-bg: #e0e0e0;
      --minus-text: #333333;
      --fab-bg: #007bff;
      --fab-active: #0056b3;
      --reset-fab-bg: #f57c00;
      --reset-fab-active: #e65100;
      --status-bg: rgba(255, 255, 255, 0.95);
      --status-shadow: rgba(0,0,0,0.12);
      --input-edit-bg: #ffffff;
      --input-edit-border: #007bff;
      --input-edit-text: #222222;
      --drop-target-bg: rgba(0, 123, 255, 0.08);
      --drop-target-border: #007bff;
      --subtask-line: #cbd5e1;
      --toggle-arrow: #555555;
    }

    body.dark-mode {
      --bg-color: #121212;
      --text-color: #e0e0e0;
      --card-bg: #1e1e1e;
      --border-color: #2c2c2c;
      --header-bg: #1e1e1e;
      --status-color: #aaa;
      --drag-handle: #777777;
      --xp-bg: #1b3320;
      --xp-border: #2e7d32;
      --xp-text: #81c784;
      --minus-bg: #333333;
      --minus-text: #ffffff;
      --fab-bg: #0d6efd;
      --fab-active: #0b5ed7;
      --reset-fab-bg: #fb8c00;
      --reset-fab-active: #f57c00;
      --status-bg: rgba(30, 30, 30, 0.95);
      --status-shadow: rgba(0,0,0,0.5);
      --input-edit-bg: #2a2a2a;
      --input-edit-border: #3d8bfd;
      --input-edit-text: #ffffff;
      --drop-target-bg: rgba(13, 110, 253, 0.18);
      --drop-target-border: #0d6efd;
      --subtask-line: #475569;
      --toggle-arrow: #cccccc;
    }

    ::selection {
      background-color: #b3d7ff;
      color: #000000;
    }

    body.dark-mode ::selection {
      background-color: #0d6efd;
      color: #ffffff;
    }

    body { 
      font-family: system-ui, -apple-system, sans-serif; 
      padding: 20px; 
      max-width: 500px; 
      margin: auto; 
      padding-bottom: 140px;
      background-color: var(--bg-color);
      color: var(--text-color);
      transition: background-color 0.3s, color 0.3s;
    }
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
      margin-bottom: 15px;
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    h2 { 
      margin: 0; 
      cursor: pointer; 
      user-select: none;
    }
    h2:active {
      opacity: 0.7;
    }
    
    .xp-container {
      display: flex;
      align-items: center;
      background: var(--xp-bg);
      border: 1px solid var(--xp-border);
      padding: 6px 12px;
      border-radius: 20px;
      font-weight: bold;
      color: var(--xp-text);
      font-size: 15px;
    }
    .minus-btn {
      background: var(--minus-bg);
      color: var(--minus-text);
      border: none;
      border-radius: 50%;
      width: 24px;
      height: 24px;
      margin-left: 8px;
      cursor: pointer;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }

    ul { list-style-type: none; padding: 0; }
    
    /* Ana Kart Yapısı ve Akıcı CSS Geçişleri */
    li { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      font-size: 16px;
      background: var(--card-bg);
      user-select: none;
      touch-action: manipulation;
      
      /* Akıcı Kayma Animasyonu için Kritik Özellikler */
      max-height: 100px;
      opacity: 1;
      padding: 12px 10px;
      margin-bottom: 4px;
      border-bottom: 1px solid var(--border-color);
      border-radius: 8px;
      overflow: hidden;
      box-sizing: border-box;
      transform: translateY(0);
      
      transition: 
        max-height 0.35s cubic-bezier(0.4, 0, 0.2, 1),
        opacity 0.3s cubic-bezier(0.4, 0, 0.2, 1),
        padding 0.35s cubic-bezier(0.4, 0, 0.2, 1),
        margin 0.35s cubic-bezier(0.4, 0, 0.2, 1),
        transform 0.35s cubic-bezier(0.4, 0, 0.2, 1),
        border-color 0.3s ease,
        background-color 0.2s ease;
    }

    /* Katlandığında Akıcı Kayarak Gizlenme Sınıfı */
    li.collapsed-subtask {
      max-height: 0 !important;
      opacity: 0 !important;
      padding-top: 0 !important;
      padding-bottom: 0 !important;
      margin-top: 0 !important;
      margin-bottom: 0 !important;
      border-bottom-color: transparent !important;
      transform: translateY(-12px) !important;
      pointer-events: none !important;
    }

    /* Alt Görev Yapısı */
    li.is-subtask {
      margin-left: 28px;
      border-left: 3px solid var(--subtask-line);
      font-size: 15px;
      background-color: rgba(0,0,0,0.015);
    }
    body.dark-mode li.is-subtask {
      background-color: rgba(255,255,255,0.02);
    }

    /* Kalın SVG Ok Butonu ve Dönüş Animasyonu */
    .collapse-toggle {
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      margin-right: 4px;
      color: var(--toggle-arrow);
      user-select: none;
      border-radius: 4px;
      transition: background-color 0.2s;
    }
    .collapse-toggle:hover {
      background-color: rgba(0,0,0,0.06);
    }
    body.dark-mode .collapse-toggle:hover {
      background-color: rgba(255,255,255,0.1);
    }
    .collapse-toggle svg {
      transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      display: block;
    }
    .collapse-toggle.collapsed svg {
      transform: rotate(-90deg);
    }
    .collapse-toggle.spacer {
      visibility: hidden;
      pointer-events: none;
    }

    /* Sürükle Bırak ve Alt Görev Hedefleme */
    li.drag-over-subtask {
      background-color: var(--drop-target-bg) !important;
      outline: 2px dashed var(--drop-target-border);
      outline-offset: -2px;
    }
    
    li.completing {
      opacity: 0;
      transform: scale(0.95) translateY(-8px);
      max-height: 0;
      padding-top: 0;
      padding-bottom: 0;
      margin-top: 0;
      margin-bottom: 0;
      border-bottom-color: transparent;
    }

    li.dragging {
      opacity: 0.4;
    }
    .drag-handle {
      cursor: grab;
      margin-right: 8px;
      color: var(--drag-handle);
      font-size: 18px;
    }
    
    .recurring-toggle {
      cursor: pointer;
      font-size: 16px;
      margin-right: 8px;
      opacity: 0.35;
      filter: grayscale(100%);
      transition: opacity 0.2s, filter 0.2s, transform 0.2s;
      user-select: none;
    }
    .recurring-toggle.active {
      opacity: 1;
      filter: grayscale(0%);
      transform: scale(1.15);
    }

    .item-content {
      display: flex;
      align-items: center;
      flex-grow: 1;
      margin-right: 10px;
      overflow: hidden;
    }
    
    .todo-text {
      cursor: text;
      padding: 4px 6px;
      border-radius: 4px;
      transition: background-color 0.2s;
      word-break: break-word;
      flex-grow: 1;
      user-select: text;
    }
    .todo-text:hover {
      background-color: rgba(0, 0, 0, 0.05);
    }
    body.dark-mode .todo-text:hover {
      background-color: rgba(255, 255, 255, 0.08);
    }

    .edit-input {
      font-size: 16px;
      padding: 4px 8px;
      border: 1.5px solid var(--input-edit-border);
      border-radius: 6px;
      background-color: var(--input-edit-bg);
      color: var(--input-edit-text);
      width: 100%;
      box-sizing: border-box;
      outline: none;
    }

    .actions {
      display: flex;
      gap: 6px;
      position: relative;
      flex-shrink: 0;
    }
    .complete-btn {
      background: #28a745;
      color: white;
      border: none;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }
    .delete-btn { 
      background: #ff4d4d; 
      color: white; 
      border: none; 
      padding: 6px 10px; 
      border-radius: 6px; 
      cursor: pointer; 
      font-size: 14px;
    }

    .plus-one-float {
      position: fixed;
      color: #28a745;
      font-weight: 800;
      font-size: 18px;
      pointer-events: none;
      animation: floatUp 0.85s cubic-bezier(0.25, 1, 0.5, 1) forwards;
      z-index: 9999;
      text-shadow: 0 2px 4px rgba(0,0,0,0.15);
    }

    @keyframes floatUp {
      0% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
      50% {
        opacity: 1;
        transform: translateY(-22px) scale(1.25);
      }
      100% {
        opacity: 0;
        transform: translateY(-40px) scale(1);
      }
    }
    
    .fab-container {
      position: fixed;
      bottom: 24px;
      right: 24px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 12px;
      z-index: 1000;
    }
    
    .fab-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    #status { 
      color: var(--status-color); 
      font-size: 13px; 
      margin: 0;
      background: var(--status-bg);
      padding: 8px 14px;
      border-radius: 20px;
      box-shadow: 0 4px 12px var(--status-shadow);
      border: 1px solid var(--border-color);
      white-space: nowrap;
      opacity: 0;
      transform: translateY(4px);
      transition: opacity 0.2s, transform 0.2s;
      pointer-events: none;
    }
    #status.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .fab-btn { 
      width: 52px;
      height: 52px;
      color: white;
      border: none;
      border-radius: 18px;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(0,0,0,0.22);
      transition: transform 0.2s, background-color 0.2s, box-shadow 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
    }
    .fab-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.28);
    }
    .fab-btn:active {
      transform: scale(0.92);
    }

    #recordBtn {
      background-color: var(--fab-bg);
    }
    #recordBtn:active {
      background-color: var(--fab-active);
    }

    #resetFabBtn {
      background-color: var(--reset-fab-bg);
    }
    #resetFabBtn:active {
      background-color: var(--reset-fab-active);
    }

    .fab-btn svg {
      display: block;
    }
  </style>
</head>
<body>

  <div class="header-bar">
    <h2 id="appTitle" title="Temayı değiştirmek için tıklayın">Yapılacaklar Listesi</h2>
    <div class="header-right">
      <div class="xp-container">
        <span id="xpDisplay">XP: 0</span>
        <button class="minus-btn" id="minusXpBtn" title="1 XP Düşür">-1</button>
      </div>
    </div>
  </div>
  
  <ul id="todoList"></ul>

  <div class="fab-container">
    <div class="fab-row">
      <button class="fab-btn" id="resetFabBtn" title="Tekrarlayan Görevleri Sıfırla">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12a9 9 0 1 1-9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/>
          <path d="M21 3v5h-5"/>
        </svg>
      </button>
    </div>

    <div class="fab-row">
      <p id="status"></p>
      <button class="fab-btn" id="recordBtn" title="Sesle Görev Ekle">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
          <line x1="12" y1="19" x2="12" y2="22"/>
        </svg>
      </button>
    </div>
  </div>

  <script>
    const recordBtn = document.getElementById('recordBtn');
    const resetFabBtn = document.getElementById('resetFabBtn');
    const status = document.getElementById('status');
    const todoList = document.getElementById('todoList');
    const xpDisplay = document.getElementById('xpDisplay');
    const minusXpBtn = document.getElementById('minusXpBtn');
    const appTitle = document.getElementById('appTitle');

    let rawTodos = JSON.parse(localStorage.getItem('myTodos')) || [];
    
    let todos = rawTodos.map((item, index) => {
      if (typeof item === 'string') {
        return {
          id: Date.now() + '_' + Math.random().toString(36).substr(2, 9),
          text: item,
          isRecurring: false,
          isCompleted: false,
          order: index,
          parentId: null,
          isCollapsed: false
        };
      }
      if (item.parentId === undefined) item.parentId = null;
      if (item.isCollapsed === undefined) item.isCollapsed = false;
      return item;
    });

    let xp = parseInt(localStorage.getItem('userXP')) || 0;
    let isDarkMode = localStorage.getItem('darkMode') === 'true';

    function playBellSound() {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const ctx = new AudioContext();

        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(1567.98, ctx.currentTime);

        gain.gain.setValueAtTime(0, ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.75, ctx.currentTime + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.9);

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.start(ctx.currentTime);
        osc.stop(ctx.currentTime + 0.9);
      } catch (e) {}
    }

    function saveTodos() {
      localStorage.setItem('myTodos', JSON.stringify(todos));
    }

    function applyTheme() {
      if (isDarkMode) {
        document.body.classList.add('dark-mode');
      } else {
        document.body.classList.remove('dark-mode');
      }
    }

    appTitle.addEventListener('click', () => {
      isDarkMode = !isDarkMode;
      localStorage.setItem('darkMode', isDarkMode);
      applyTheme();
    });

    function updateXP(newXp) {
      xp = Math.max(0, newXp);
      localStorage.setItem('userXP', xp);
      xpDisplay.textContent = `XP: ${xp}`;
    }

    minusXpBtn.addEventListener('click', () => {
      updateXP(xp - 1);
    });

    resetFabBtn.addEventListener('click', () => {
      todos.forEach(todo => {
        if (todo.isRecurring && todo.isCompleted) {
          todo.isCompleted = false;
        }
      });
      saveTodos();
      renderTodos();
      setStatusText('Tekrarlayanlar sıfırlandı!');
      setTimeout(() => setStatusText(''), 2000);
    });

    function capitalizeFirstLetter(string) {
      if (!string) return '';
      return string.charAt(0).toLocaleUpperCase('tr-TR') + string.slice(1);
    }

    function setStatusText(text) {
      if (!text) {
        status.classList.remove('visible');
        setTimeout(() => { status.textContent = ''; }, 200);
      } else {
        status.textContent = text;
        status.classList.add('visible');
      }
    }

    /* Yumuşak Katlama Geçiş Mantığı */
    function toggleCollapse(id, e) {
      if (e) e.stopPropagation();
      const todo = todos.find(t => t.id === id);
      if (!todo) return;

      todo.isCollapsed = !todo.isCollapsed;
      saveTodos();

      // Ok simgesini anında döndür
      const parentLi = todoList.querySelector(`li[data-id="${id}"]`);
      if (parentLi) {
        const toggleBtn = parentLi.querySelector('.collapse-toggle');
        if (toggleBtn) {
          toggleBtn.classList.toggle('collapsed', todo.isCollapsed);
        }
      }

      // Bağlı alt görevlerin DOM elemanlarını bulup class'ını animasyonla değiştir
      const subtaskTodos = todos.filter(t => t.parentId === id);
      subtaskTodos.forEach(sub => {
        const subLi = todoList.querySelector(`li[data-id="${sub.id}"]`);
        if (subLi) {
          if (todo.isCollapsed) {
            subLi.classList.add('collapsed-subtask');
          } else {
            subLi.classList.remove('collapsed-subtask');
          }
        }
      });
    }

    function renderTodos() {
      todoList.innerHTML = '';
      
      let visibleTodos = todos.filter(todo => !todo.isCompleted);

      let parentTodos = visibleTodos.filter(t => !t.parentId);
      
      parentTodos.sort((a, b) => {
        if (a.isRecurring === b.isRecurring) {
          return a.order - b.order;
        }
        return a.isRecurring ? 1 : -1;
      });

      let orderedList = [];
      parentTodos.forEach(parent => {
        orderedList.push(parent);
        let subtasks = visibleTodos.filter(t => t.parentId === parent.id);
        subtasks.sort((a, b) => a.order - b.order);
        orderedList.push(...subtasks);
      });

      visibleTodos.forEach(t => {
        if (!orderedList.includes(t)) {
          orderedList.push(t);
        }
      });

      orderedList.forEach((todo) => {
        const li = document.createElement('li');
        li.draggable = true;
        li.dataset.id = todo.id;

        const hasSubtasks = visibleTodos.some(t => t.parentId === todo.id);

        if (todo.parentId) {
          li.classList.add('is-subtask');
          const parentTodo = todos.find(t => t.id === todo.parentId);
          if (parentTodo && parentTodo.isCollapsed) {
            li.classList.add('collapsed-subtask');
          }
        }

        const contentDiv = document.createElement('div');
        contentDiv.className = 'item-content';

        // Kalın SVG Ok Simgesi
        const toggleSpan = document.createElement('span');
        if (!todo.parentId && hasSubtasks) {
          toggleSpan.className = `collapse-toggle ${todo.isCollapsed ? 'collapsed' : ''}`;
          toggleSpan.title = todo.isCollapsed ? 'Alt görevleri göster' : 'Alt görevleri gizle';
          toggleSpan.innerHTML = `
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          `;
          toggleSpan.onclick = (e) => toggleCollapse(todo.id, e);
        } else if (!todo.parentId) {
          toggleSpan.className = 'collapse-toggle spacer';
        }

        const dragHandle = document.createElement('span');
        dragHandle.className = 'drag-handle';
        dragHandle.innerHTML = '☰';

        const recurringToggle = document.createElement('span');
        recurringToggle.className = `recurring-toggle ${todo.isRecurring ? 'active' : ''}`;
        recurringToggle.innerHTML = '🔄';
        recurringToggle.title = todo.isRecurring ? 'Tekrarlayan Görev (Aktif)' : 'Tek Seferlik Görev (Pasif)';
        recurringToggle.onclick = (e) => {
          e.stopPropagation();
          toggleRecurring(todo.id);
        };

        const textSpan = document.createElement('span');
        textSpan.className = 'todo-text';
        textSpan.textContent = todo.text;
        textSpan.title = 'Düzenlemek için tıklayın';

        textSpan.addEventListener('click', (e) => {
          e.stopPropagation();
          enableEditing(todo.id, textSpan);
        });

        if (!todo.parentId) {
          contentDiv.appendChild(toggleSpan);
        }
        contentDiv.appendChild(dragHandle);
        contentDiv.appendChild(recurringToggle);
        contentDiv.appendChild(textSpan);

        const actionsDiv = document.createElement('div');
        actionsDiv.className = 'actions';

        const completeBtn = document.createElement('button');
        completeBtn.textContent = '✓';
        completeBtn.className = 'complete-btn';
        completeBtn.title = 'Tamamla (+1 XP)';
        completeBtn.onclick = (e) => completeTodo(todo.id, li, completeBtn, e);

        const delBtn = document.createElement('button');
        delBtn.textContent = 'Sil';
        delBtn.className = 'delete-btn';
        delBtn.onclick = () => removeTodo(todo.id);

        actionsDiv.appendChild(completeBtn);
        actionsDiv.appendChild(delBtn);

        li.appendChild(contentDiv);
        li.appendChild(actionsDiv);

        addDragListeners(li);
        todoList.appendChild(li);
      });
    }

    function enableEditing(id, textElement) {
      const todo = todos.find(t => t.id === id);
      if (!todo) return;

      const input = document.createElement('input');
      input.type = 'text';
      input.className = 'edit-input';
      input.value = todo.text;

      textElement.replaceWith(input);
      input.focus();
      input.select();

      let isFinished = false;

      function finishEdit() {
        if (isFinished) return;
        isFinished = true;

        const newText = input.value.trim();
        if (newText.length > 0) {
          todo.text = capitalizeFirstLetter(newText);
          saveTodos();
        }
        renderTodos();
      }

      input.addEventListener('blur', finishEdit);

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          finishEdit();
        } else if (e.key === 'Escape') {
          isFinished = true;
          renderTodos();
        }
      });
    }

    function toggleRecurring(id) {
      const todo = todos.find(t => t.id === id);
      if (todo) {
        todo.isRecurring = !todo.isRecurring;
        if (todo.isRecurring) {
          const maxOrder = todos.reduce((max, t) => Math.max(max, t.order || 0), 0);
          todo.order = maxOrder + 1;
        }
        saveTodos();
        renderTodos();
      }
    }

    let draggedItem = null;

    function addDragListeners(item) {
      item.addEventListener('dragstart', (e) => {
        draggedItem = item;
        item.classList.add('dragging');
        e.dataTransfer.setData('text/plain', item.dataset.id);
      });

      item.addEventListener('dragend', () => {
        draggedItem = null;
        item.classList.remove('dragging');
        document.querySelectorAll('.drag-over-subtask').forEach(el => el.classList.remove('drag-over-subtask'));
        saveNewOrder();
        renderTodos();
      });

      item.addEventListener('dragover', (e) => {
        e.preventDefault();
        if (!draggedItem || draggedItem === item) return;

        const draggedId = draggedItem.dataset.id;
        const targetId = item.dataset.id;

        const draggedTodo = todos.find(t => t.id === draggedId);
        const targetTodo = todos.find(t => t.id === targetId);

        if (!draggedTodo || !targetTodo) return;

        if (draggedTodo.id === targetTodo.parentId) return;

        const box = item.getBoundingClientRect();
        const offsetX = e.clientX - box.left;

        if (offsetX > 60 && !targetTodo.parentId) {
          item.classList.add('drag-over-subtask');
        } else {
          item.classList.remove('drag-over-subtask');
          const afterElement = getDragAfterElement(todoList, e.clientY);
          if (afterElement == null) {
            todoList.appendChild(draggedItem);
          } else {
            todoList.insertBefore(draggedItem, afterElement);
          }
        }
      });

      item.addEventListener('dragleave', () => {
        item.classList.remove('drag-over-subtask');
      });

      item.addEventListener('drop', (e) => {
        e.preventDefault();
        if (!draggedItem || draggedItem === item) return;

        const draggedId = draggedItem.dataset.id;
        const targetId = item.dataset.id;

        const draggedTodo = todos.find(t => t.id === draggedId);
        const targetTodo = todos.find(t => t.id === targetId);

        if (item.classList.contains('drag-over-subtask')) {
          item.classList.remove('drag-over-subtask');
          if (!targetTodo.parentId && draggedTodo.id !== targetTodo.id) {
            draggedTodo.parentId = targetTodo.id;
            targetTodo.isCollapsed = false;
          }
        }
      });
    }

    todoList.addEventListener('dragover', (e) => {
      e.preventDefault();
      const isOverLi = e.target.closest('li');
      if (!isOverLi && draggedItem) {
        const draggedTodo = todos.find(t => t.id === draggedItem.dataset.id);
        if (draggedTodo && e.clientX < 100) {
          draggedTodo.parentId = null;
        }
      }
    });

    function getDragAfterElement(container, y) {
      const draggableElements = [...container.querySelectorAll('li:not(.dragging):not(.collapsed-subtask)')];

      return draggableElements.reduce((closest, child) => {
        const box = child.getBoundingClientRect();
        const offset = y - box.top - box.height / 2;
        if (offset < 0 && offset > closest.offset) {
          return { offset: offset, element: child };
        } else {
          return closest;
        }
      }, { offset: Number.NEGATIVE_INFINITY }).element;
    }

    function saveNewOrder() {
      const listItems = todoList.querySelectorAll('li');
      listItems.forEach((li, newIndex) => {
        const id = li.dataset.id;
        const todo = todos.find(t => t.id === id);
        if (todo) {
          todo.order = newIndex;
        }
      });
      saveTodos();
    }

    function addTodo(text) {
      const formattedText = capitalizeFirstLetter(text);
      const newTodo = {
        id: Date.now() + '_' + Math.random().toString(36).substr(2, 9),
        text: formattedText,
        isRecurring: false,
        isCompleted: false,
        order: todos.length,
        parentId: null,
        isCollapsed: false
      };
      todos.push(newTodo);
      saveTodos();
      renderTodos();
    }

    function completeTodo(id, liElement, btnElement, event) {
      playBellSound();

      const plusOne = document.createElement('span');
      plusOne.className = 'plus-one-float';
      plusOne.textContent = '+1';
      
      const btnRect = btnElement.getBoundingClientRect();
      
      plusOne.style.left = (btnRect.left + 6) + 'px';
      plusOne.style.top = (btnRect.top - 8) + 'px';
      
      document.body.appendChild(plusOne);

      setTimeout(() => {
        plusOne.remove();
      }, 850);

      if ('vibrate' in navigator) {
        navigator.vibrate(18);
      }

      liElement.classList.add('completing');

      const subtaskTodos = todos.filter(t => t.parentId === id && !t.isCompleted);
      subtaskTodos.forEach(sub => {
        const subLi = todoList.querySelector(`li[data-id="${sub.id}"]`);
        if (subLi) subLi.classList.add('completing');
      });

      setTimeout(() => {
        const index = todos.findIndex(t => t.id === id);
        if (index !== -1) {
          const mainTodo = todos[index];
          let earnedXP = 1;

          if (mainTodo.isRecurring) {
            mainTodo.isCompleted = true;
          } else {
            todos.splice(index, 1);
          }

          subtaskTodos.forEach(sub => {
            const subIndex = todos.findIndex(t => t.id === sub.id);
            if (subIndex !== -1) {
              if (sub.isRecurring) {
                sub.isCompleted = true;
              } else {
                todos.splice(todos.findIndex(t => t.id === sub.id), 1);
              }
              earnedXP += 1;
            }
          });

          saveTodos();
          updateXP(xp + earnedXP);
          renderTodos();
        }
      }, 300);
    }

    function removeTodo(id) {
      const index = todos.findIndex(t => t.id === id);
      if (index !== -1) {
        todos.forEach(t => {
          if (t.parentId === id) t.parentId = null;
        });
        todos.splice(index, 1);
        saveTodos();
        renderTodos();
      }
    }

    applyTheme();
    updateXP(xp);
    renderTodos();

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (SpeechRecognition) {
      const recognition = new SpeechRecognition();
      recognition.lang = 'tr-TR';

      recordBtn.addEventListener('click', () => {
        recognition.start();
        setStatusText('Dinleniyor... Konuşun');
      });

      recognition.onresult = (event) => {
        let text = event.results[0][0].transcript;
        text = capitalizeFirstLetter(text);
        setStatusText(`Eklenen: "${text}"`);
        addTodo(text);
        setTimeout(() => setStatusText(''), 2500);
      };

      recognition.onerror = () => { 
        setStatusText('Ses anlaşılamadı!'); 
        setTimeout(() => setStatusText(''), 2500);
      };

      recognition.onend = () => { 
        if (status.textContent === 'Dinleniyor... Konuşun') {
          setStatusText('');
        }
      };
    } else {
      setStatusText('Tarayıcı ses desteklemiyor.');
    }
  </script>
</body>
</html>
